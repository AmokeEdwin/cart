<!DOCTYPE html>
<html>
  <head>
    <title>
      invoice calculater
    </title>
    <link rel="stylesheet" href="style1.css">
  </head>

  <body>
    <div id="main">
      <form action="">

         <span id="invoice">
          product invoice
         </span><br><br>

        <div class="form-row">
          <label>Product Name</label>
          <input type="text">
        </div>

        <div class="form-row">
            <label>Unit Price</label>
            <input id="price" type="number">
        </div>

        <div class="form-row">
            <label>Quantity</label>
            <input id="quantity" type="number">
        </div>

        <button type="button" onclick="calculate()">Calculate</button>


        <div class="results">

            <div class="result-row" id="subtotal">
                <span>Subtotal</span>
                <span id="ks">Ksh 0.00</span>
            </div>

            <div class="result-row" id="tax">
                <span>Tax</span>
                <span id="ks">Ksh 0.00</span>
            </div>

            <div class="result-row" id="total">
                <span>Total</span>
                <span id="ks">Ksh 0.00</span>
            </div>

        </div>
      </form>  
    </div>
  </body>
  <script src="script.js"></script>
</html>
